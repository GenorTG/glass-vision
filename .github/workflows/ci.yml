name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (Python ${{ matrix.python }}, CPU)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/models
          key: models-${{ hashFiles('scripts/download_models.py') }}
      # The real installer, CPU build: also tests install.sh itself.
      - name: Install (scripts/install.sh, CPU)
        run: scripts/install.sh --non-interactive --cuda cpu --python "$(command -v python)" --no-token --no-systemd --no-apk
      - name: Dev tools
        run: server/.venv/bin/python -m pip install -r server/requirements-dev.txt
      - name: Lint
        working-directory: server
        run: |
          .venv/bin/ruff check . ../scripts
          .venv/bin/ruff format --check . ../scripts
      - name: Tests (GPU tests skip themselves)
        working-directory: server
        run: ./run -m pytest -q tests

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, unit tests, lint, UI snapshots
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug verifyPaparazziDebug
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/paparazzi/failures/
          retention-days: 7
